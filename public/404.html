<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>VoiceAI BD</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect logic
      // This script takes the current url and converts the path and query
      // into a hash fragment so that the single page app can handle it properly.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      // If we are on a custom domain or user/org site, pathSegmentsToKeep is 0.
      // If on a project page like username.github.io/repo-name/, pathSegmentsToKeep is 1.
      var isGithubProjectPage = l.hostname.indexOf('github.io') > -1 && l.pathname.split('/').length > 2;
      var segments = isGithubProjectPage ? 1 : 0;

      var path = l.pathname.slice(1).split('/').slice(segments).join('/');
      var redirectUrl = l.protocol + '//' + l.host +
        (segments > 0 ? '/' + l.pathname.split('/')[1] : '') +
        '/?p=/' + path +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;

      window.location.replace(redirectUrl);
    </script>
  </head>
  <body>
    <div style="background:#140702; color:#fff; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:sans-serif;">
      <p>লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</p>
    </div>
  </body>
</html>
